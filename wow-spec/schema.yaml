openapi: '3.0.4'
info:
  title: OpenSpatialWorld API — OSL contract surface
  version: '0.0.1'
  # x-osl-* keys are LABELED OSL metadata, never part of the canonical standard.
  x-osl-overlay-version: '0.1.0'
  x-osl-source-of-truth: true
  x-osl-canonical-basis: >-
    Canonical schemas (World/User/View/Portal/Node/Spatial) and the /wow/world,
    /wow/user, /wow/view, /wow/portal and /wow/spatial paths are transcribed
    from the OPEN OpenSpatialWorld API (github.com/WebOfWorlds/WoWAPI,
    specification/OpenSpatialWorld/API.yaml, openapi 3.0.4, info.version 0.0.1),
    pinned to upstream commit d39a1a0 ("fixed node children type", 2026-05-21).
  x-osl-provenance-correction: >-
    CORRECTION (2026-07-11, runtime; supersedes the previous claim
    here that this file was "NOT copied from the UNLICENSED simpleWorlds
    reference implementation"). That sentence was NOT supportable and is
    withdrawn. Two things in the first transcription match the STALE spec copy
    vendored in the simpleWorlds reference implementation rather than the open
    spec: (1) `Node.children` was typed `integer`, where the open spec says
    `$ref: Node` (simpleWorlds packages/wow-spec/src/schema.yaml:425-428 types it
    `integer`; upstream has ONE commit, so NO published upstream state has ever
    said `integer`); and (2) the dotted operationIds (world.getWorld,
    user.getUser, user.deleteUser, view.getView, portal.getPortal) match
    simpleWorlds 5-for-5, where upstream uses getWorldStatus / getUserById /
    deleteUserById / getViewById / getPortalById. Sourcing was MIXED, not
    wholesale: the /wow/spatial/{spatialID}/node/{nodeId} path is the OPEN
    SPEC's, and OSL deliberately REJECTED simpleWorlds' /wow/scene/node
    divergence (PROP §9). `Node` is now restored VERBATIM from the open spec.
    What OSL served then (id-ref children) was the LABELED, non-canonical
    `OSLFlatNode` divergence — declared, never presented as the standard. Since
    iteration 1 OSL serves the canonical `Node` by default and the flat form only
    on explicit request.
    NO simpleWorlds SOURCE CODE is vendored in this repository; the schema
    typing and operationId NAMING above are the extent of the overlap, and the
    typing is corrected. LICENSING NOTE: simpleWorlds' license state is
    self-contradictory — the repo ships an Apache-2.0 LICENSE file while its
    package.json (root and packages/wow-spec) declares "license": "UNLICENSED".
    Because that is unresolved, OSL treats simpleWorlds as DO-NOT-COPY and
    single-sources the open spec.
  description: |
    OSL's typed, validated source of truth for the OpenSpatialWorld
    ("Web of Worlds") API. This is the contract every WoW-primary OSL
    component builds against.

    HONESTY / EXTENSION POLICY (binding, see wow-spec/OSL-WOW-CONTRACT.md):
      * CANONICAL surfaces carry the tag `canonical` and are transcribed from
        the open OpenSpatialWorld spec (WoWAPI@d39a1a0). Where OSL diverges
        from the standard, the operation/schema carries `x-osl-divergence` and
        the payload schema is a LABELED extension — NEVER a canonical one.
        (The known divergences are enumerated in OSL-WOW-CONTRACT.md §9.)
      * OSL ADDITIONS are ADDITIVE, carry the tag `osl-extension`, and every
        such schema/property is annotated `x-osl-extension: true`. They are
        NEVER canonical and MUST be surfaced (never hidden) by the conformance
        components.
      * `standards_conformance` stays `false` on every `/wow` response
        (validation-boundary honesty). No cosmetic conformance.
      * The WoW `Portal` schema has NO destination field; OSL carries a portal
        destination as a LABELED extension (`PortalDestination`).
      * `WS /events` is a LABELED non-canonical realtime convention,
        documented in the contract note, NOT in this HTTP contract.

    Frames. All coordinates are in meters, right-handed, +Y up. A Spatial's GeoPose anchors its origin: at zero angles +X is east, +Y up and +Z south. All other positions are local to their parent.

    Media type. Resources are served as application/wow+json, a working name that stays provisional until the group decides it. It is JSON, and its fragment identifiers are JSON Pointers (RFC 6901, section 6). application/json stays available by content negotiation.

    Entity tags. GET /wow/world, GET /wow/spatial/{spatialID} and the node GET return ETag and Last-Modified, and answer If-None-Match with 304. The node PUT and DELETE honour If-Match and answer 412 when it does not match (RFC 9110).

    Cross-origin reads. Responses carry Access-Control-Allow-Origin as the world's policy allows, and Access-Control-Expose-Headers: ETag. Preflight responses allow Authorization, If-None-Match and If-Match.

    Events. A world's event stream is listed in the World resource under services.events, relative to the world's base URL. It carries user_joined, user_left, node_created, node_updated and node_deleted. As simpleWorlds sends them, user_joined carries user (the User), user_left carries userId, node_created and node_updated carry node (the Node), and node_deleted carries nodeId. Each event adds revision (this world's count of its changes, one higher for each; it survives restarts, and the World resource reports the current one), time (the server's UTC time of the change, in RFC 3339 form) and urls (every resource whose representation changed, relative to the base: the User for a user event, the node and every ancestor that embeds it for a node event, and wow/world, which reports the revision). A write that leaves a representation unchanged creates no revision and no event. A client resumes with since=<revision>; a world that can no longer replay from there sends resync with its current revision, and the client re-reads.

    Stream authentication. A world that requires authorization for its stream expects as the stream's first message the JSON text {"type": "auth", "token": "<access token>"}, and closes a stream without a valid token within 5 seconds. It refuses a stream from an origin its policy does not allow. Tokens never go in URLs.

    Data points. A data point is a resource URL with a JSON Pointer fragment (RFC 6901, section 6), such as {base}wow/spatial/1/node/42#/properties/temperature. The pointer never passes through children: a child is named by its own node URL. Reading, conditional reading and subscribing create no user.

servers:
  - url: http://127.0.0.1:18151
    description: OSL local world-server node A (labeled local validation; not public)
  - url: http://127.0.0.1:18152
    description: OSL local world-server node B (labeled local validation; not public)

tags:
  - name: canonical
    description: >-
      Transcribed from the open OpenSpatialWorld spec (WoWAPI@d39a1a0). Where
      OSL diverges, the operation/schema carries x-osl-divergence and the
      response is a LABELED extension schema — never a canonical one.
  - name: osl-extension
    description: >-
      LABELED OSL addition where the WoW standard is silent. Additive,
      non-canonical, annotated x-osl-extension, surfaced by conformance.

paths:
  # --- World (canonical) ---
  /wow/world:
    get:
      operationId: world.getWorld
      tags: [canonical]
      x-osl-overlay: iteration-2
      summary: Returns a World status as a single data state.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: world summary (canonical World + labeled OSL extensions)
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/wow+json:
              schema:
                $ref: '#/components/schemas/OSLWorldResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/OSLWorldResponse'
        '304':
          $ref: '#/components/responses/NotModified'

  # --- User (canonical) ---
  /wow/user/{userId}:
    get:
      operationId: user.getUser
      tags: [canonical]
      summary: Returns a User status.
      parameters:
        - name: userId
          in: path
          description: ID of user to return (canonical domain is integer).
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: user (canonical User + labeled OSL extensions)
          content:
            application/wow+json:
              schema:
                $ref: '#/components/schemas/OSLUserResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/OSLUserResponse'
        '404':
          description: user not found
    delete:
      operationId: user.deleteUser
      tags: [canonical]
      summary: Deletes a user.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User deleted
        '400':
          description: Invalid user value
        default:
          description: Unexpected error

  # --- View (canonical) ---
  /wow/view/{viewId}:
    get:
      operationId: view.getView
      tags: [canonical]
      summary: Returns a Viewpoint status.
      parameters:
        - name: viewId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: view (canonical View + labeled OSL extensions)
          content:
            application/wow+json:
              schema:
                $ref: '#/components/schemas/OSLViewResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/OSLViewResponse'
        '404':
          description: view not found

  # --- Portal (canonical schema; destination is a LABELED OSL extension) ---
  /wow/portal/{portalId}:
    get:
      operationId: portal.getPortal
      tags: [canonical]
      summary: Returns a Portal status.
      parameters:
        - name: portalId
          in: path
          description: ID of portal to return (canonical domain is integer).
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: portal (canonical Portal + labeled OSL extensions)
          content:
            application/wow+json:
              schema:
                $ref: '#/components/schemas/OSLPortalResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/OSLPortalResponse'
        '404':
          description: portal not found

  # --- Spatial Composition Graph (canonical paths and payloads) ---
  # OVERLAY (iteration 1, proposed upstream edit; x-osl-overlay marks each change). The paths are the
  # open spec's own `/wow/spatial/{spatialID}` and `/wow/spatial/{spatialID}/node/{nodeId}` (the
  # simpleWorlds reference implementation diverges to `/wow/scene/node/{nodeId}`; OSL does not).
  #
  # The payloads are the canonical ones: `GET /wow/spatial/{spatialID}` returns a `Spatial`, and a node
  # is the canonical `Node`, its children embedded. The LABELED `OSLFlatNode` (children are integer ids)
  # is served only when a request asks for the node form `flat`.
  #
  # `spatialID` is an integer. OSL still resolves the string aliases it used to address a graph by (the
  # world id, the location id, 'default', 'world'); they are deprecated.
  #
  # NOTE (D5): the open spec OMITS the `spatialID` path parameter on the four node operations and
  # misspells DELETE's as `nodeid`, so its own template variables are undeclared or unmatched.
  # OpenAPI requires every template variable to be declared. OSL declares `spatialID` on all four
  # and spells `nodeId` correctly: a repair of the standard, proposed upstream.
  /wow/spatial/{spatialID}:
    get:
      operationId: spatial.getSpatial
      tags: [canonical]
      x-osl-overlay: iteration-1 and iteration-2
      summary: Returns a Spatial (the graph id, the root node id and the GeoPose anchor of the graph).
      parameters:
        - name: spatialID
          in: path
          description: >-
            ID of the spatial composition graph. An integer. OSL also resolves the
            deprecated string aliases (world id, location id, 'default', 'world').
          required: true
          schema:
            type: integer
        - name: form
          in: query
          required: false
          x-osl-extension: true
          description: >-
            OSL EXTENSION. `descriptor` (default; alias `spatial`) returns the `Spatial`. `node`
            returns the graph's root node itself, as the canonical `Node` or, with the node form
            `flat`, as the `OSLFlatNode`. The served form is echoed in the `X-OSL-WoW-Spatial-Form`
            response header. Equivalent to the request header of the same name, which wins.
          schema:
            type: string
            enum: [descriptor, spatial, node]
            default: descriptor
        - name: X-OSL-WoW-Spatial-Form
          in: header
          required: false
          x-osl-extension: true
          description: The request-header form of the `form` query parameter.
          schema:
            type: string
            enum: [descriptor, spatial, node]
        - name: X-OSL-WoW-Node-Form
          in: header
          required: false
          x-osl-extension: true
          description: >-
            OSL EXTENSION. With `form=node`: `flat` returns the root as the `OSLFlatNode`; omitted
            or `canonical` returns the canonical `Node`.
          schema:
            type: string
            enum: [canonical, flat]
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: >-
            The `Spatial` by default. With `form=node`, the root node, and the response header
            `X-OSL-WoW-Spatial-Form` says `node`.
          headers:
            X-OSL-WoW-Spatial-Form:
              description: "Echoes the served representation: `descriptor` or `node`."
              required: true
              schema:
                type: string
                enum: [node, descriptor]
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/wow+json:
              schema:
                $ref: '#/components/schemas/Spatial'
            application/json:
              schema:
                $ref: '#/components/schemas/Spatial'
        '304':
          $ref: '#/components/responses/NotModified'
        '404':
          description: spatial graph not found

  /wow/spatial/{spatialID}/node/{nodeId}:
    get:
      operationId: spatial.getNode
      tags: [canonical]
      x-osl-overlay: iteration-1 and iteration-2
      summary: Returns a node of the spatial composition graph, with its whole subtree embedded.
      parameters:
        - name: spatialID
          in: path
          required: true
          description: ID of the spatial composition graph (an integer; string aliases are deprecated).
          schema:
            type: integer
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
        - name: X-OSL-WoW-Node-Form
          in: header
          required: false
          x-osl-extension: true
          description: >-
            OSL EXTENSION. `flat` returns the node as the `OSLFlatNode` (children are integer ids).
            Omitted, or `canonical`, returns the canonical `Node`. `?nodeForm=flat` is equivalent.
          schema:
            type: string
            enum: [canonical, flat]
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: The node as the canonical `Node`; the `OSLFlatNode` when the node form is `flat`.
          headers:
            X-OSL-WoW-Node-Form:
              description: "Echoes the served form: `canonical` or `flat`."
              required: true
              schema:
                type: string
                enum: [canonical, flat]
            ETag:
              $ref: '#/components/headers/ETag'
            Last-Modified:
              $ref: '#/components/headers/LastModified'
          content:
            application/wow+json:
              schema:
                $ref: '#/components/schemas/Node'
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '304':
          $ref: '#/components/responses/NotModified'
        '403':
          x-osl-extension: true
          description: >-
            OSL EXTENSION. The world's read policy refuses this node to this reader
            (`node_read_refused`); the canonical form of its parent leaves it out.
        '404':
          description: node not found
    post:
      operationId: spatial.createNodes
      tags: [canonical]
      x-osl-overlay: iteration-1 and iteration-2
      summary: Create and add new child nodes under the given parent node.
      parameters:
        - name: spatialID
          in: path
          required: true
          description: ID of the spatial composition graph (an integer; string aliases are deprecated).
          schema:
            type: integer
        - name: nodeId
          in: path
          description: ID of the existing parent node.
          required: true
          schema:
            type: integer
        - name: X-OSL-WoW-Node-Form
          in: header
          required: false
          x-osl-extension: true
          description: >-
            OSL EXTENSION. `flat` means the body is `OSLFlatNode[]` (leaf nodes only) and the response
            is every node stored, as `OSLFlatNode[]`. Omitted, or `canonical`, means the body is the
            canonical `Node[]`, whose children may be embedded to any depth; the server assigns every id
            and returns the nodes the caller sent, with their subtrees and the ids assigned.
          schema:
            type: string
            enum: [canonical, flat]
      requestBody:
        description: Array of new nodes to add as children of the parent. Canonical `Node[]` by default.
        required: true
        content:
          application/wow+json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Node'
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/Node'
      responses:
        '200':
          description: >-
            Successful operation: the created nodes as `Node[]`, ids assigned at every depth. The
            response header `X-OSL-WoW-Nodes-Stored` reports stored over sent.
          headers:
            X-OSL-WoW-Node-Form:
              description: "Echoes the served form: `canonical` or `flat`."
              required: true
              schema:
                type: string
                enum: [canonical, flat]
          content:
            application/wow+json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Node'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Node'
        '400':
          description: >-
            OSL EXTENSION. `invalid_child_entry`, or, in the `flat` form,
            `child_id_refs_not_supported_on_create`.
        '404':
          description: parent node not found
        '422':
          description: >-
            Validation exception. A body that is not a valid `Node[]` (`node_validation_failed`), a
            `localTransform` that is not a placement (`invalid_local_transform`: wrong length, a last
            row other than 0,0,0,1, a number that overflows, or shear), or a graph that would
            be too deep (`node_tree_too_deep`). Nothing is stored.
        default:
          description: Unexpected error
    put:
      operationId: spatial.updateNode
      tags: [canonical]
      x-osl-overlay: iteration-1 and iteration-2
      summary: Update an existing node's content, or move it by setting `parent`.
      parameters:
        - name: spatialID
          in: path
          required: true
          description: ID of the spatial composition graph (an integer; string aliases are deprecated).
          schema:
            type: integer
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
        - name: X-OSL-WoW-Node-Form
          in: header
          required: false
          x-osl-extension: true
          description: OSL EXTENSION. `flat` means the body is an `OSLFlatNode`. Omitted, or `canonical`, means a `Node`.
          schema:
            type: string
            enum: [canonical, flat]
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        description: >-
          The updated node. `children` is derived from the tree: a PUT may leave it out or repeat it
          unchanged, and a PUT whose `children` differ from the stored ones is refused. A PUT of
          `parent` moves the node, with its subtree, under another node of the same graph.
        required: true
        content:
          application/wow+json:
            schema:
              $ref: '#/components/schemas/Node'
          application/json:
            schema:
              $ref: '#/components/schemas/Node'
      responses:
        '200':
          description: "Successful operation: the node as the canonical `Node`."
          headers:
            X-OSL-WoW-Node-Form:
              description: "Echoes the served form: `canonical` or `flat`."
              required: true
              schema:
                type: string
                enum: [canonical, flat]
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/wow+json:
              schema:
                $ref: '#/components/schemas/Node'
            application/json:
              schema:
                $ref: '#/components/schemas/Node'
        '400':
          description: Invalid ID supplied
        '404':
          description: node not found
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        '422':
          description: >-
            Validation exception. `child_restructure_not_supported` (the `children` sent differ from
            the stored ones), `invalid_local_transform`, or a refused move: `parent_not_found`,
            `parent_would_create_cycle`, `cannot_move_root`, `invalid_parent`, `node_tree_too_deep`.
        default:
          description: Unexpected error
    delete:
      operationId: spatial.deleteNode
      tags: [canonical]
      x-osl-overlay: iteration-1 and iteration-2
      summary: Deletes a node and its subtree. Its ids are never issued again within the world.
      parameters:
        - name: spatialID
          in: path
          required: true
          description: ID of the spatial composition graph (an integer; string aliases are deprecated).
          schema:
            type: integer
        - name: nodeId
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: node deleted
        '400':
          description: Invalid node value, or the root, which cannot be deleted.
        '404':
          description: node not found
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          description: Unexpected error

# ------------------------------------------------------------------
# Components
# ------------------------------------------------------------------
components:
  # OVERLAY (iteration 2, proposed upstream edit): conditional requests (wow-spec/overlays/iteration-2/).
  parameters:
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: Entity tags the client holds; a match answers 304 with no body.
      required: false
      schema:
        type: string
    IfMatch:
      name: If-Match
      in: header
      description: The entity tag the change is based on; no match answers 412 and changes nothing.
      required: false
      schema:
        type: string
  headers:
    ETag:
      description: Entity tag of this representation.
      schema:
        type: string
    LastModified:
      description: When this representation last changed (HTTP-date).
      schema:
        type: string
  responses:
    NotModified:
      description: Not modified; the client's copy is current.
    PreconditionFailed:
      description: If-Match does not match the node's current entity tag; read the node again and retry.
  schemas:

    # ============================================================
    # CANONICAL SCHEMAS — transcribed 1:1 (by shape) from the open
    # OpenSpatialWorld API.yaml (components.schemas), except where an
    # `x-osl-overlay: iteration-1` mark says this file carries OSL's
    # PROPOSED upstream edit instead (see wow-spec/overlays/iteration-1/).
    # No additionalProperties:false — the standard leaves schemas open,
    # which is the seam OSL extends.
    # ============================================================

    GeoPose:
      # OVERLAY (iteration 1, proposed upstream edit): OGC GeoPose 1.0 Basic-YPR, one definition
      # for every `geoPose` in the API. The standard at d39a1a0 inlines five copies and spells
      # longitude `lan`; the OGC schema and the GeoPose examples spell it `lon`.
      #   - position: latitude and longitude in degrees, `h` in meters above the WGS-84 ellipsoid.
      #   - angles: degrees, yaw about up, then pitch, then roll (the sense and order are an
      #     assumption until the GeoPose working group confirms them).
      #   - `lan` is read as `lon` and is deprecated; a server never emits it.
      #   - On World, a geoPose is the world's location for discovery, not a placement. On Spatial
      #     it anchors the graph's origin: at zero angles +X is east, +Y up and +Z south.
      x-osl-overlay: iteration-1
      description: >-
        OGC GeoPose 1.0 Basic-YPR. `position` is latitude and longitude in degrees, and `h` in meters
        above the WGS-84 ellipsoid. `angles` are `yaw`, `pitch` and `roll` in degrees, applied about the
        local axes z, y and x in that order. A writer sends `lon`. A reader also accepts `lan`, the earlier
        spelling, and refuses a position whose `lon` and `lan` differ.
      type: object
      required: [position, angles]
      properties:
        position:
          type: object
          required: [lat, h]
          anyOf:
            - required: [lon]
            - required: [lan]
          properties:
            lat:
              type: number
              minimum: -90
              maximum: 90
            lon:
              type: number
              minimum: -180
              maximum: 180
            lan:
              type: number
              minimum: -180
              maximum: 180
              deprecated: true
              description: Earlier spelling of `lon`.
            h:
              type: number
        angles:
          type: object
          required: [yaw, pitch, roll]
          properties:
            yaw:
              type: number
            pitch:
              type: number
            roll:
              type: number

    World:
      type: object
      properties:
        content:
          type: object
          properties:
            label:
              type: string
            age_restriction:
              type: number
            license:
              type: string
            cost:
              type: string
            version:
              type: number
            duration:
              type: number
        geoPose:
          description: >-
            The world's location, for discovery. It is not a placement: nothing inside the world is
            positioned by it.
          allOf:
            - $ref: '#/components/schemas/GeoPose'
        spatials:
          x-osl-overlay: iteration-2
          type: array
          description: The ids of the world's graphs (Spatial resources), the default graph first.
          items:
            type: integer
        revision:
          x-osl-overlay: iteration-3
          type: integer
          description: This world's current revision, the count of its changes; each event carries the revision it made.
        services:
          x-osl-overlay: iteration-3
          type: object
          description: The world's services, as URI references relative to its base URL.
          properties:
            events:
              type: string
              description: The event stream (WebSocket).
        presence:
          type: object
          properties:
            avatar:
              type: string
            navigation:
              type: string
            gravity:
              type: string
        technology:
          type: object
          properties:
            webXR-immersive:
              type: string
            runtime:
              type: string
        users:
          type: object
          properties:
            active_user_count:
              type: integer
              default: 1
            total_user_count:
              type: integer
              default: 1
        views:
          type: object
          properties:
            view_count:
              type: integer
              default: 1
        portals:
          type: object
          properties:
            portal_count:
              type: integer
              default: 1

    User:
      type: object
      properties:
        id:
          type: number
        name:
          type: string
        AvatarURI:
          type: string
        geoPose:
          $ref: '#/components/schemas/GeoPose'

    View:
      type: object
      properties:
        id:
          type: number
        geoPose:
          $ref: '#/components/schemas/GeoPose'

    Portal:
      # CANONICAL: a bare positioned anchor. NOTE: the standard's Portal has
      # NO destination/target field — it cannot express "leads to world X".
      # OSL supplies that as a LABELED extension (see PortalDestination).
      type: object
      properties:
        id:
          type: number
        geoPose:
          $ref: '#/components/schemas/GeoPose'

    Node:
      # OVERLAY (iteration 1, proposed upstream edit). The canonical scene-graph entity, from the open
      # spec (WoWAPI@d39a1a0, API.yaml lines 471-495), with these additions:
      #   - id: unique within the world and never reused, after a delete, a reset or a restart.
      #   - parent: one parent per node, except the graph's root. A PUT of `parent` moves the node,
      #     with its subtree, within its graph.
      #   - children: the child nodes, embedded. Derived from the tree: a PUT never changes them.
      #   - localTransform: 16 numbers, column-major, in meters.
      # OSL serves this shape by default. The LABELED `OSLFlatNode` (children are integer ids) is
      # served only when a request asks for the node form `flat`.
      x-osl-overlay: iteration-1
      type: object
      properties:
        id:
          type: integer
          description: Unique within the world, and never reused.
        label:
          type: string
        names:
          type: array
          items:
            type: string
        parent:
          type: integer
          description: >-
            The node this one is placed in. Every node has one parent, except the graph's root, which
            has none. A PUT of `parent` moves the node, with its subtree, under another node of the
            same graph; a move under the node itself or its own descendant is refused.
        children:
          type: array
          description: >-
            The child nodes, embedded. Derived from the tree: a PUT leaves them out or repeats them
            unchanged, and a PUT whose children differ is refused.
          items:
            $ref: '#/components/schemas/Node'
        localTransform:
          type: array
          minItems: 16
          maxItems: 16
          description: >-
            Column-major 4×4 matrix mapping this node's frame into its parent's frame, in meters. It
            decomposes into translation, rotation and scale, as glTF 2.0 §3.5.3 requires of
            `node.matrix`, so it has no shear.
          items:
            type: number
        spatialAssetURI:
          x-osl-overlay: iteration-2
          type: string
          description: >-
            The address of this node's content: a model, or the Spatial, Node or wow/world resource of
            any world, which is then shown at this node. A client tells them apart by the media type of
            the answer, never by the address: application/wow+json is another world's content. The
            including node stands in for the included node's parent. A whole world shows its default
            graph, and its other anchored graphs where their GeoPoses put them. The included world's
            environment does not apply to the host. The host sets a nesting limit and a budget, detects
            cycles by URL, and shows a placeholder on failure.
        appearanceURI:
          type: string
        properties:
          x-osl-overlay: iteration-3
          type: object
          description: >-
            Data on the node, as a JSON-LD node object: its "@context" names a context document by URL or gives a
            context inline, and its "@type", expanded through that context, types the node. The context published
            beside the world schema (schema/context.jsonld) defines the terms used here; its terms are provisional.
            A node whose type is wow:Environment belongs, with its subtree, to its world's environment, which does
            not apply when another world includes it. A property whose value is a URL names data held elsewhere. A
            data point names one value with a JSON Pointer fragment on the node's URL.

    Spatial:
      # OVERLAY (iteration 1, proposed upstream edit). A graph: its integer id, the id of its root node
      # and the GeoPose that anchors the graph's origin on the WGS-84 ellipsoid. It POINTS AT the root
      # node (`rootNodeID`); the root node itself is at /wow/spatial/{id}/node/{rootNodeID}. OSL
      # returns it by default from `GET /wow/spatial/{spatialID}`.
      x-osl-overlay: iteration-1
      type: object
      properties:
        id:
          type: integer
          description: The graph's id, an integer.
        rootNodeID:
          type: integer
        geoPose:
          $ref: '#/components/schemas/GeoPose'

    # ============================================================
    # LABELED OSL EXTENSIONS — additive, NON-CANONICAL. Every schema
    # below is annotated x-osl-extension:true and MUST be surfaced by
    # the conformance components. The WoW standard is silent on all of these.
    # ============================================================

    ProofBoundary:
      # The four claim-boundary flags REQUIRED on every /wow response.
      # OSL owns this schema fully, so it is strict (additionalProperties:false,
      # all four required booleans). standards_conformance is honestly `false`
      # in this version; the server enforces the truthful values, this contract
      # enforces the flags' presence, and conformance surfaces them.
      x-osl-extension: true
      type: object
      additionalProperties: false
      required:
        - application_level_handoff
        - native_teleportxr_teleport
        - first_party_teleportxr_browser_rendering
        - standards_conformance
      properties:
        application_level_handoff:
          type: boolean
        native_teleportxr_teleport:
          type: boolean
          description: 'false in this version — no native TeleportXR session teleport.'
        first_party_teleportxr_browser_rendering:
          type: boolean
          description: 'false in this version — not first-party TeleportXR rendering.'
        standards_conformance:
          type: boolean
          description: 'false on every /wow response — no cosmetic conformance.'

    PortalDestination:
      # The destination the CANONICAL Portal cannot express. runtime migrates
      # portal semantics onto this labeled extension and proposes it upstream.
      # All fields optional (a portal may be under-specified) but the shape is
      # documented so client + server single-source it.
      x-osl-extension: true
      type: object
      properties:
        target_world_id:
          type: string
        target_location_id:
          type: string
        target_base_url:
          type: string
          description: 'base URL of the destination world server.'
        spatial_fabric_address:
          type: string
          description: 'loadable spatial fabric address of the destination.'

    SpatialFabricSubtree:
      # LABELED, NON-CANONICAL. A WoW composition-graph node
      # that TRANSCLUDES a signed `.msf` spatial fabric as a verifiable, executable
      # SUBTREE — the subtree analogue of the node's glTF LEAF.
      #
      # TRANSCLUSION, NOT TRAVERSAL. This is `<img src>`, not `<a href>`. The child
      # fabric is DRAWN HERE, in this node's own accumulated frame (Sneeze's
      # Compositor.cpp attachment hook: "traverse it in this node's own accumulated
      # frame"). Artemis's Earth IS the child fabric — nobody travels to it. The
      # TRAVERSAL relation is `PortalDestination` on a `Portal`, and the two are
      # deliberately NOT merged.
      #
      # THE ADDRESS vs THE CONTRACT. `Node.spatialAssetURI` is the ADDRESS, and a
      # `.msf` URL in it is SPEC-LEGAL today: the canonical `Node` types it as a
      # bare `string` with no `format`, no `mediaType`, no enum and no prose (open
      # spec, API.yaml). We ADOPT that. But "permitted" is not "specified" — the
      # address cannot carry what a SUBTREE needs and a LEAF does not: the scale
      # contract, the up-axis, the trust policy, the recursion cap, the epoch. THIS
      # schema is that contract, and it is LABELED as ours. No parallel address
      # field is invented.
      x-osl-extension: true
      x-osl-extends: Node
      x-osl-divergence: 'D8 — the WoW standard has no concept of a node that transcludes a SIGNED, EXECUTABLE spatial document. OpenSpatialAsset is media-type-plural (model/gltf-binary, model/vnd.usdz+zip, ...) but has NO signed-document type. This capability is OURS, labeled, and proposed upstream — it is not granted by the spec.'
      type: object
      # STRICT (like ProofBoundary): OSL owns this schema outright. An unknown
      # member here would be a DIAL THE ENGINE SILENTLY IGNORES — precisely the
      # failure mode this schema exists to kill. A new dial is added HERE first.
      additionalProperties: false
      required:
        - fabricURI
        - unitsPerMeter
        - upAxis
        - placement
      description: >-
        LABELED OSL EXTENSION — carried at `node.webofworlds_extension.spatial_fabric_subtree`.
        It is the CONTRACT behind the ADDRESS in `Node.spatialAssetURI`, and it is the DISCRIMINATOR:
        a node is a fabric node iff this member is present. The `.msf` suffix is NEVER sniffed —
        suffix-sniffing hides exactly the contract this object exists to state.
        FOUR REQUIRED FIELDS, and every one of them is required for a reason that has already bitten:
        (a) `unitsPerMeter` has NO DEFAULT. The fabric compositor's `auto` rule is "a fabric whose walk
        contains celestial nodes composes in AU; any other composes in its native metres". Inherited into
        a 1:1-metre WoW room, `auto` silently means 1 AU = 1 METRE. That is a defensible reading and a
        catastrophic default, so it is REFUSED, not defaulted (OSL-FAB-XFORM-1 §3).
        (b) `upAxis` has NO DEFAULT. The fabric corpus is Z-up; WoW/Three is Y-up. Guess wrong and the
        solar system lies on its side, silently. An absent or unrecognized `upAxis` is a REFUSAL
        (OSL-FAB-XFORM-1 §2 — the implementation refuses it, so this contract requires it; a contract
        that disagreed with its implementation would be the very disease this components is treating).
        (c) `placement` has NO DEFAULT. It SELECTS THE BACKEND, and the two backends make DIFFERENT
        HONESTY CLAIMS (see the property description). Defaulting would pick a claim on the author's behalf.
        (d) `fabricURI` is the signed document itself.
        NOTHING HERE EARNS A CONFORMANCE FLIP: `standards_conformance` stays `false`. The capability is
        labeled OSL, declared as divergence D8, surfaced by the conformance components — never disguised as canonical.
      properties:
        fabricURI:
          type: string
          description: >-
            The signed `.msf` spatial fabric to transclude. NORMALLY IDENTICAL to the node's
            `spatialAssetURI` (which stays the WoW-native address). Resolved and then VERIFIED
            fail-closed by the existing `.msf` pipeline (`verifyMsfToken`) — an unverified,
            unfetchable or tampered fabric is REFUSED with a visible error at EVERY nesting level:
            never silently dropped, never drawn.
        mediaType:
          type: string
          description: >-
            PROVISIONAL, UNREGISTERED LABEL. `application/msf+jws` is the honest provisional name for a
            signed, executable spatial document. NO SUCH MEDIA TYPE IS REGISTERED WITH IANA — do not
            claim otherwise. Registering (or renaming) it is an upstream/MSF question, not ours to settle.
            Advisory only: it is NOT the discriminator (the presence of this schema is).
        unitsPerMeter:
          type: number
          exclusiveMinimum: 0
          description: >-
            REQUIRED. NO DEFAULT. EVER. World units per fabric metre (`k` in OSL-FAB-XFORM-1 §3).
            It is FOLDED INTO THE COMPOSITOR (`composeScale = k * s`, where `s` is the node's decomposed
            uniform scale) rather than post-multiplied — the engine's own (S·R)² light-intensity rule then
            applies for free and correctly. Worked example (the demo case): a tabletop orrery with
            1 AU = 0.5 m in a 1:1-metre room is `k = 0.5 / 149597870700 = 3.3423e-12`. Omitting this field
            is a REFUSAL (`MISSING_UNITS_PER_METER`); a non-positive or non-finite value is
            `BAD_UNITS_PER_METER`.
        upAxis:
          type: string
          enum: [z, y]
          description: >-
            REQUIRED. DECLARED, NEVER SNIFFED, NEVER DEFAULTED. `z` = the fabric corpus default (the shared
            Sneeze UV sphere is Z-up), and the host inserts the fixed basis change B = R_x(-90°) — a pure
            isometry, determinant +1, so NO GEOMETRY IS RESHAPED. `y` = the fabric is authored Y-up and
            B = I. An absent or unrecognized value is a REFUSAL (`UNKNOWN_UP_AXIS`), never a fallback to
            `z` — a fallback would silently reintroduce the exact bug this field exists to kill
            (OSL-FAB-XFORM-1 §2).
        placement:
          type: string
          enum: [in-room, backdrop]
          description: >-
            REQUIRED. NO DEFAULT. It SELECTS THE BACKEND, and the two backends make DIFFERENT, INCOMPATIBLE
            HONESTY CLAIMS — so an absent/unknown value is a REFUSAL (`UNKNOWN_PLACEMENT`), never a silent
            fallback to the flattering backend.
            `in-room` -> the THREE lowering: ONE scene graph, ONE depth buffer, so an avatar can walk in
            front of / behind / around the fabric and the occlusion is CORRECT. Shading is APPROXIMATE and
            it carries **NO PARITY CLAIM, EVER** (`render: "three-approx"`).
            `backdrop` -> the FILAMENT stacked layer: the measured-parity path (masked SSIM 0.941 vs
            Artemis's own capture), but it CANNOT DEPTH-COMPOSITE — two stacked WebGL canvases have no
            shared depth buffer (that is physics, not preference), so NOTHING IN THE ROOM CAN EVER OCCLUDE
            IT. `artemis.msf` is a backdrop and works perfectly as one; an in-room plinth-mounted fabric
            would be painter-ordered and an avatar could not walk in front of it.
        parallax:
          type: number
          minimum: 0
          maximum: 1
          default: 0
          description: >-
            BACKDROP ONLY. A LABELED dial, 0..1. `0` (the honest default) = orientation-locked: the backdrop
            follows the camera's rotation but not its translation, which is the truthful behaviour for a
            layer that has no shared depth buffer. Meaningless for `in-room` (which is genuinely
            depth-correct and needs no parallax fake).
        requireVerified:
          type: boolean
          default: true
          description: >-
            FAIL-CLOSED BY DEFAULT. Absent or `true` => the fabric MUST verify (RS256 + x5c chain to a
            SHIPPED test anchor) or it is REFUSED and NOT DRAWN, keeping a labeled placeholder and a visible
            error. `false` is a LABELED local demo ESCAPE HATCH ONLY — it must never be set in a demo or a published
            world, and a world that sets it cannot claim its subtree is verified. NOTE: "VERIFIED" means a
            valid signature chaining to a shipped TEST anchor; it is NOT an OS-trust / public-PKI claim.
        maxDepth:
          type: integer
          minimum: 0
          description: >-
            Per-subtree recursion cap for nested child fabrics (a fabric may transclude fabrics). ALWAYS
            CLAMPED by the engine's absolute MAX_DEPTH — this dial can only ever LOWER the cap, never raise
            it past the engine's own limit.
        epochTicks:
          type: number
          description: >-
            The epoch at which the fabric's `map.wasm` is run. Fabrics are TIME-DEPENDENT BY DESIGN (orbits
            move), so the epoch must be STATED rather than implied by wall-clock. This is also why the
            fabric's internal nodes are NOT projected back up into the WoW graph as addressable WoW nodes:
            any such projection is a SNAPSHOT AT AN EPOCH, not a graph (deliberately deferred).

    Zone:
      # An OSL-native interaction volume around a portal (e.g. a larger prefetch
      # zone vs a smaller traversal trigger).
      x-osl-extension: true
      type: object
      properties:
        kind:
          type: string
          description: 'e.g. prefetch | trigger'
        position:
          type: array
          items:
            type: number
        radius_m:
          type: number

    PortalTraversal:
      # OSL-native traversal-direction rule beside a portal.
      x-osl-extension: true
      type: object
      properties:
        mode:
          type: string
          description: 'bidirectional | one-way'
        allowed_entry_side:
          type: string
          description: 'named against the portal frame forward axis.'

    OSLFlatNode:
      # LABELED, NON-CANONICAL — OSL's flat node form, served and accepted ONLY on
      # explicit request (`X-OSL-WoW-Node-Form: flat` or `?nodeForm=flat`). Since
      # iteration 1 the default form of a node is the canonical `Node`.
      #
      # It differs from the canonical `Node` in one way (the labeled remainder of the
      # retired divergence D1):
      #   canonical: children = array of EMBEDDED Node objects (items: $ref Node)
      #   flat form: children = array of INTEGER node-id references
      #
      # WHY keep it: a client that wants one node without its subtree can read it in
      # O(1) with no cycle hazard on the wire. This is a deliberate ENGINEERING choice,
      # NOT a reading of the standard. It is SURFACED (never hidden) by the conformance
      # components, and labeled as ours.
      #
      # `localTransform` is a 16-number column-major 4x4 matrix, as in the canonical
      # Node of this contract (the iteration 1 overlay, D9). The conformance components
      # report a non-16 length as the declared divergence D9, not as spec drift.
      x-osl-extension: true
      x-osl-divergence: 'Node.children: integer id-refs (OSL) vs embedded Node objects (canonical)'
      x-osl-canonical-counterpart: Node
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
        names:
          type: array
          items:
            type: string
        parent:
          type: integer
        children:
          type: array
          items:
            type: integer
        localTransform:
          type: array
          items:
            type: number
        spatialAssetURI:
          type: string
        appearanceURI:
          type: string
        properties:
          x-osl-overlay: iteration-3
          type: object
          description: Data on the node, as in the canonical Node.
        webofworlds_extension:
          $ref: '#/components/schemas/WebOfWorldsExtension'

    UMSignature:
      # runtime — the UniversalManifest Signature Profile A block:
      # Ed25519 over JCS-RFC8785 canonical bytes, bound to a did:key. This is the
      # IDENTITY trust spine — SEPARATE from the .msf RS256/x5c engine spine. A REAL
      # signature; standards_conformance stays false (labeled non-canonical).
      x-osl-extension: true
      type: object
      properties:
        algorithm:
          type: string
          description: 'MUST be "Ed25519" (the Profile A pair; never reinterpreted).'
        canonicalization:
          type: string
          description: 'MUST be "JCS-RFC8785".'
        keyRef:
          type: string
          description: 'did:key DID URL (offline-resolvable; consistency-checked vs the embedded key).'
        publicKeySpkiB64:
          type: string
          description: 'base64 SPKI DER Ed25519 public key (the suite embedded-key escape hatch).'
        created:
          type: string
          description: 'ISO 8601 (recommended). Lives inside the signature block; excluded from the signing input.'
        value:
          type: string
          description: 'base64url (unpadded) Ed25519 signature over the JCS-RFC8785 signing input.'

    OpenUserManifest:
      # runtime — the retained UM identity fronted via /wow/user. The
      # OpenUserManifest CONTENT shape {name, age, avatarAssetURI} is the payload UM
      # Signature Profile A signs (signing input = this object MINUS `signature`),
      # plus the attached signature block. WoW's canonical User is silent on `age`
      # and carries no identity signature; this labeled non-canonical additive is
      # OpenUserManifest ≡ UM (same identity spine, not a new standard). The
      # signature is REAL; standards_conformance stays false.
      x-osl-extension: true
      type: object
      additionalProperties: true
      properties:
        name:
          type: string
        age:
          type: number
        avatarAssetURI:
          type: string
        signature:
          # When signed: a UMSignature block (see that schema). When the signer is
          # unavailable: `null` (honest unsigned/unverified degradation). Left
          # untyped so BOTH states validate under the additive ajv layer (ajv
          # ignores OpenAPI `nullable`, so an untyped member accepts object-or-null).
          description: 'UMSignature when signed; null on honest unsigned/unverified degradation.'

    WebOfWorldsExtension:
      # The LABELED open extension bag OSL rides on the WoW read surface. It is
      # intentionally OPEN (additionalProperties:true) because it is the
      # evolving, non-canonical seam. Named members below are documented so
      # server + client single-source them; unknown members ride legally.
      x-osl-extension: true
      type: object
      additionalProperties: true
      properties:
        schema:
          type: string
        geopose_mapping:
          type: object
          additionalProperties: true
        target_world_id:
          type: string
        target_location_id:
          type: string
        target_base_url:
          type: string
        spatial_fabric_address:
          # OSL-native loadable fabric address (the osl.spatial-fabric-address
          # profile object the live 041 server emits). Non-canonical, OPEN
          # shape — typed as an open object to mirror server reality, not a
          # flat string. (The forward-looking flat address lives on the
          # labeled PortalDestination extension; runtime.)
          type: object
          additionalProperties: true
        spatial_fabric_subtree:
          # runtime — the labeled TRANSCLUSION contract. Its presence
          # is what makes a node a FABRIC node (the discriminator; the `.msf`
          # suffix is never sniffed). Because this member is a $ref to a STRICT
          # schema, a served node carrying a MALFORMED subtree contract now FAILS
          # OSLFlatNode validation — the fail-closed rule reaches the wire, not
          # just the client.
          $ref: '#/components/schemas/SpatialFabricSubtree'
        portal_id:
          type: string
        trigger:
          $ref: '#/components/schemas/Zone'
        zones:
          # OSL-native portal interaction volumes, emitted as a KEYED object
          # (e.g. { prefetch, traversal, invariant, ... }) by the live server —
          # NOT an array. Non-canonical, OPEN shape.
          type: object
          additionalProperties: true
        traversal:
          $ref: '#/components/schemas/PortalTraversal'
        traversal_mode:
          type: string

    # ============================================================
    # OSL RESPONSE COMPOSITES — what the OSL 041 server ACTUALLY
    # returns: the CANONICAL schema PLUS the LABELED OSL extensions.
    # Response validation uses THESE; the canonical schemas above stay
    # pure so the conformance components can diff canonical vs actual.
    # ============================================================

    OSLWorldResponse:
      x-osl-extension: true
      allOf:
        - $ref: '#/components/schemas/World'
        - type: object
          required:
            - proof_boundary
          properties:
            proof_boundary:
              $ref: '#/components/schemas/ProofBoundary'
            webofworlds_extension:
              $ref: '#/components/schemas/WebOfWorldsExtension'
            # legacy members the running 057 web client still reads (labeled)
            id:
              type: string
            location:
              type: object
              additionalProperties: true
            session:
              type: object
              additionalProperties: true

    OSLUserResponse:
      x-osl-extension: true
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required:
            - proof_boundary
          properties:
            proof_boundary:
              $ref: '#/components/schemas/ProofBoundary'
            webofworlds_extension:
              $ref: '#/components/schemas/WebOfWorldsExtension'
            # runtime — LABELED non-canonical additive UM identity: the
            # signed OpenUserManifest {name, age, avatarAssetURI, signature}. The
            # canonical User above stays pure for the runtime conformance diff; this
            # is the surfaced extension point (never hidden).
            open_user_manifest:
              $ref: '#/components/schemas/OpenUserManifest'
            open_user_manifest_label:
              type: string
              description: 'Honesty label for open_user_manifest (real signature, non-canonical, standards_conformance:false).'

    OSLViewResponse:
      x-osl-extension: true
      allOf:
        - $ref: '#/components/schemas/View'
        - type: object
          required:
            - proof_boundary
          properties:
            proof_boundary:
              $ref: '#/components/schemas/ProofBoundary'
            webofworlds_extension:
              $ref: '#/components/schemas/WebOfWorldsExtension'

    OSLPortalResponse:
      x-osl-extension: true
      allOf:
        - $ref: '#/components/schemas/Portal'
        - type: object
          required:
            - proof_boundary
          properties:
            label:
              type: string
            proof_boundary:
              $ref: '#/components/schemas/ProofBoundary'
            webofworlds_extension:
              $ref: '#/components/schemas/WebOfWorldsExtension'
            # runtime lands portal destination on this labeled extension point:
            destination:
              $ref: '#/components/schemas/PortalDestination'
